<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>梦幻账单 · 无弹窗版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            padding: 24px 16px 48px;
            color: #2c3e50;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 500;
            color: #303133;
            margin-bottom: 24px;
        }

        /* 汇总卡片 */
        .summary-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }
        .summary-card {
            background: #fff;
            border-radius: 8px;
            padding: 16px 12px;
            flex: 1;
            min-width: 110px;
            border: 1px solid #ebeef5;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .summary-label {
            font-size: 0.8rem;
            color: #909399;
            margin-bottom: 8px;
        }
        .summary-number {
            font-size: 1.7rem;
            font-weight: 600;
            color: #303133;
        }
        .profit-positive { color: #67c23a; }
        .profit-negative { color: #f56c6c; }

        /* 工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .el-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            background: #fff;
            border: 1px solid #dcdfe6;
            color: #606266;
            gap: 6px;
            transition: 0.1s;
        }
        .el-button--primary {
            background: #409eff;
            border-color: #409eff;
            color: white;
        }
        .button-group {
            display: flex;
            gap: 8px;
        }

        /* 账号卡片 */
        .accounts-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .account-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #ebeef5;
            padding: 18px;
            cursor: pointer;
            transition: 0.1s;
        }
        .account-card:active { transform: scale(0.99); }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .name-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .account-name {
            font-size: 1.2rem;
            font-weight: 500;
            color: #303133;
        }
        .school-badge {
            background: #f0f2f5;
            padding: 2px 12px;
            border-radius: 16px;
            font-size: 0.7rem;
            color: #606266;
        }
        .card-stats {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f0f2f5;
        }
        .stat-item {
            flex: 1;
        }
        .stat-label-sm {
            font-size: 0.7rem;
            color: #909399;
        }
        .stat-number-sm {
            font-weight: 600;
            font-size: 1rem;
        }
        .card-actions {
            display: flex;
            gap: 12px;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: #909399;
            padding: 4px;
            border-radius: 4px;
        }
        .icon-btn:hover {
            background: #f0f2f5;
        }

        /* 模态框 */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-container {
            background: #fff;
            width: 90%;
            max-width: 560px;
            max-height: 85vh;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header, .modal-footer {
            padding: 12px 20px;
            border-bottom: 1px solid #ebeef5;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }
        .close-icon {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #909399;
        }
        .el-input, .el-select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #dcdfe6;
            font-size: 0.9rem;
        }

        /* Tab */
        .el-tabs__header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e4e7ed;
            margin-bottom: 15px;
        }
        .tabs-left {
            display: flex;
        }
        .el-tabs__item {
            padding: 0 20px;
            height: 40px;
            line-height: 40px;
            color: #909399;
            cursor: pointer;
        }
        .el-tabs__item.active {
            color: #409eff;
            border-bottom: 2px solid #409eff;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* 条目 */
        .entry-row {
            background: #fff;
            border: 1px solid #ebeef5;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .entry-left {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .entry-desc {
            font-size: 0.85rem;
            font-weight: 500;
        }
        .entry-type-badge {
            background: #f0f2f5;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.7rem;
            width: fit-content;
        }
        .entry-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .entry-amount {
            font-weight: 700;
            font-size: 1rem;
        }
        .expense-amount { color: #f56c6c; }
        .income-amount { color: #67c23a; }
        .delete-icon-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            color: #f56c6c;
            cursor: pointer;
            padding: 6px;
        }

        .add-entry-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #fafbfc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .add-entry-bar input, .add-entry-bar select {
            flex: 1;
            min-width: 100px;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #dcdfe6;
        }
        .empty-tip {
            text-align: center;
            color: #c0c4cc;
            padding: 24px;
        }
        .type-list {
            list-style: none;
        }
        .type-list li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ebeef5;
        }
        .warning-banner {
            background: #fff3e0;
            border-left: 4px solid #e6a23c;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #b75905;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>📒 梦幻账单</h1></div>
    <div class="summary-grid" id="summaryGrid">
        <div class="summary-card"><div class="summary-label">总收入</div><div class="summary-number" id="totalIncome">0.00</div></div>
        <div class="summary-card"><div class="summary-label">实际到手</div><div class="summary-number" id="actualIncome">0.00</div></div>
        <div class="summary-card"><div class="summary-label">总支出</div><div class="summary-number" id="totalExpense">0.00</div></div>
        <div class="summary-card"><div class="summary-label">盈利情况</div><div class="summary-number" id="netProfit">0.00</div></div>
    </div>
    <div class="toolbar">
        <button class="el-button el-button--primary" id="addAccountBtn"><i class="fas fa-plus"></i> 新增账号</button>
        <div class="button-group">
            <button class="el-button" id="exportDataBtn"><i class="fas fa-download"></i> 导出</button>
            <button class="el-button" id="importDataBtn"><i class="fas fa-upload"></i> 导入</button>
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
        </div>
    </div>
    <div id="accountsList" class="accounts-grid"></div>
</div>

<script>
    // ==================== 梦幻账单核心（无备注弹窗版） ====================
    const ALL_SCHOOLS = ["大唐官府","化生寺","女儿村","方寸山","龙宫","天宫","普陀山","五庄观","阴曹地府","魔王寨","狮驼岭","盘丝洞","凌波城","神木林","无底洞","女魃墓","天机城","花果山"];
    let accounts = [];
    let INCOME_TYPES = ['梦幻币', '材料'];
    let EXPENSE_TYPES = ['角色', '点卡', '装备', '灵饰', '宝宝'];
    const STORAGE_KEY = 'DreamLedgerV11';

    let storageAvailable = false;
    try {
        const test = '__storage_test__';
        localStorage.setItem(test, test);
        localStorage.removeItem(test);
        storageAvailable = true;
    } catch(e) { console.warn('localStorage 不可用'); }

    function saveToLocal() {
        const data = { accounts, incomeTypes: INCOME_TYPES, expenseTypes: EXPENSE_TYPES };
        if (storageAvailable) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) { alert('保存失败'); }
        } else {
            if (!window._memoryBackup) window._memoryBackup = data;
            if (!document.getElementById('storageWarning')) {
                const warn = document.createElement('div');
                warn.id = 'storageWarning';
                warn.className = 'warning-banner';
                warn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> 当前环境无法永久保存数据，请点击底部「添加到主屏幕」后使用。';
                document.querySelector('.header').after(warn);
            }
        }
    }

    function loadData() {
        if (storageAvailable) {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    accounts = data.accounts || [];
                    INCOME_TYPES = data.incomeTypes || ['梦幻币', '材料'];
                    EXPENSE_TYPES = data.expenseTypes || ['角色', '点卡', '装备', '灵饰', '宝宝'];
                    return;
                } catch(e) {}
            }
        }
        accounts = [];
        INCOME_TYPES = ['梦幻币', '材料'];
        EXPENSE_TYPES = ['角色', '点卡', '装备', '灵饰', '宝宝'];
        saveToLocal();
    }

    function uuid() { return Date.now() + '-' + Math.random().toString(36).substring(2, 8); }
    function calcGlobal() { let tInc=0,tExp=0; for(let a of accounts){ tInc+=a.incomeEntries.reduce((s,e)=>s+(+e.amount||0),0); tExp+=a.expenseEntries.reduce((s,e)=>s+(+e.amount||0),0); } return { totalInc:tInc, totalExp:tExp, actual:tInc*0.95, profit:tInc*0.95-tExp }; }
    function updateSummaryUI(){ let {totalInc,totalExp,actual,profit}=calcGlobal(); document.getElementById('totalIncome').innerText=totalInc.toFixed(2); document.getElementById('actualIncome').innerText=actual.toFixed(2); document.getElementById('totalExpense').innerText=totalExp.toFixed(2); let p=document.getElementById('netProfit'); p.innerText=profit.toFixed(2); p.classList.toggle('profit-positive',profit>=0); p.classList.toggle('profit-negative',profit<0); }
    function escapeHtml(s){ return s? s.replace(/[&<>]/g, m=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])):''; }

    function renderAccounts(){
        let c=document.getElementById('accountsList');
        if(!c)return;
        if(!accounts.length){ c.innerHTML='<div style="text-align:center; padding:48px; background:#fafbfc; border-radius:8px; color:#909399;">✨ 暂无账号，点击“新增账号”开始记账</div>'; return; }
        c.innerHTML=accounts.map(acc=>`<div class="account-card" data-id="${acc.id}"><div class="card-header"><div class="name-area"><span class="account-name">${escapeHtml(acc.name)}</span><span class="school-badge">${escapeHtml(acc.school)}</span></div><div class="card-actions"><button class="icon-btn edit-account" data-id="${acc.id}"><i class="fas fa-edit"></i></button><button class="icon-btn delete-account" data-id="${acc.id}"><i class="fas fa-trash-alt"></i></button></div></div><div class="card-stats"><div class="stat-item"><div class="stat-label-sm">总收入</div><div class="stat-number-sm">${acc.incomeEntries.reduce((s,e)=>s+(+e.amount||0),0).toFixed(2)}</div></div><div class="stat-item"><div class="stat-label-sm">总支出</div><div class="stat-number-sm">${acc.expenseEntries.reduce((s,e)=>s+(+e.amount||0),0).toFixed(2)}</div></div></div></div>`).join('');
    }
    function refreshUI(){ renderAccounts(); updateSummaryUI(); saveToLocal(); }

    let currentEditId=null;
    function openAccountModal(id=null){
        currentEditId=id;
        let title='新增账号',name='',school='';
        if(id){ let a=accounts.find(a=>a.id===id); if(a){ title='编辑账号'; name=a.name; school=a.school; } }
        let opts=ALL_SCHOOLS.map(s=>`<option value="${escapeHtml(s)}" ${s===school?'selected':''}>${escapeHtml(s)}</option>`).join('');
        let html=`<div class="modal-mask" id="accountModal"><div class="modal-container"><div class="modal-header"><h3>${title}</h3><button class="close-icon" id="closeModalBtn">×</button></div><div class="modal-body"><div class="el-form-item"><label>账号名称</label><input class="el-input" id="accName" placeholder="例：可爱小狐" value="${escapeHtml(name)}"></div><div class="el-form-item"><label>门派</label><select class="el-select" id="accSchool">${opts}</select></div></div><div class="modal-footer"><button class="el-button" id="cancelModal">取消</button><button class="el-button el-button--primary" id="saveAccount">保存</button></div></div></div>`;
        document.body.insertAdjacentHTML('beforeend',html);
        let m=document.getElementById('accountModal');
        let close=()=>m.remove();
        document.getElementById('closeModalBtn')?.addEventListener('click',close);
        document.getElementById('cancelModal')?.addEventListener('click',close);
        document.getElementById('saveAccount')?.addEventListener('click',()=>{
            let n=document.getElementById('accName').value.trim();
            let s=document.getElementById('accSchool').value;
            if(!n||!s){ alert('请填写完整'); return; }
            if(currentEditId){ let idx=accounts.findIndex(a=>a.id===currentEditId); if(idx!==-1){ accounts[idx].name=n; accounts[idx].school=s; } }
            else{ accounts.push({ id:uuid(), name:n, school:s, incomeEntries:[], expenseEntries:[] }); }
            refreshUI(); close();
        });
    }
    function deleteAccountById(id,e){ if(e)e.stopPropagation(); if(confirm('删除账号会同时删除所有收支记录，确定吗？')){ accounts=accounts.filter(a=>a.id!==id); refreshUI(); } }

    let currentDetailAccountId=null;
    function openDetailModal(accountId){
        let acc=accounts.find(a=>a.id===accountId);
        if(!acc)return;
        currentDetailAccountId=accountId;
        let html=`<div class="modal-mask" id="detailModalRoot"><div class="modal-container"><div class="modal-header"><h3>${escapeHtml(acc.name)} · 账单详情</h3><button class="close-icon" id="closeDetailBtn">×</button></div><div class="modal-body"><div class="el-tabs"><div class="el-tabs__header"><div class="tabs-left"><div class="el-tabs__item" data-tab="expense">支出</div><div class="el-tabs__item" data-tab="income">收入</div></div><div class="type-manager" id="typeManagerPlaceholder"></div></div><div id="tab-expense" class="tab-pane"><div class="add-entry-bar"><input type="number" id="newExpenseAmount" placeholder="金额" step="0.01"><select id="newExpenseType"></select><button class="el-button el-button--primary el-button--small" id="addExpenseBtn"><i class="fas fa-plus"></i> 添加支出</button></div><div id="expenseListContainer"></div></div><div id="tab-income" class="tab-pane"><div class="add-entry-bar"><input type="number" id="newIncomeAmount" placeholder="金额" step="0.01"><select id="newIncomeType"></select><button class="el-button el-button--primary el-button--small" id="addIncomeBtn"><i class="fas fa-plus"></i> 添加收入</button></div><div id="incomeListContainer"></div></div></div></div><div class="modal-footer"><button class="el-button" id="closeDetailFooter">关闭</button></div></div></div>`;
        document.body.insertAdjacentHTML('beforeend',html);
        let modalRoot=document.getElementById('detailModalRoot');
        let closeModal=()=>modalRoot.remove();
        document.getElementById('closeDetailBtn')?.addEventListener('click',closeModal);
        document.getElementById('closeDetailFooter')?.addEventListener('click',closeModal);

        let mgr=document.getElementById('typeManagerPlaceholder');
        let updateMgr=()=>{
            let active=document.querySelector('.tab-pane.active')?.id;
            if(active==='tab-expense') mgr.innerHTML='<button class="el-button el-button--default el-button--small" id="manageExpenseBtn"><i class="fas fa-cog"></i> 管理支出类型</button>';
            else mgr.innerHTML='<button class="el-button el-button--default el-button--small" id="manageIncomeBtn"><i class="fas fa-cog"></i> 管理收入类型</button>';
            document.getElementById('manageExpenseBtn')?.addEventListener('click',()=>openTypeManager('expense',acc.id));
            document.getElementById('manageIncomeBtn')?.addEventListener('click',()=>openTypeManager('income',acc.id));
        };

        let renderLists=()=>{
            let expDiv=document.getElementById('expenseListContainer');
            if(expDiv){
                if(acc.expenseEntries.length===0) expDiv.innerHTML='<div class="empty-tip">暂无支出记录</div>';
                else expDiv.innerHTML=acc.expenseEntries.map(e=>`<div class="entry-row"><div class="entry-left"><div class="entry-desc">${escapeHtml(e.description||'无备注')}</div><div class="entry-type-badge">${escapeHtml(e.type)}</div></div><div class="entry-right"><div class="entry-amount expense-amount">-${(+e.amount).toFixed(2)}</div><button class="delete-icon-btn delete-expense" data-id="${e.id}"><i class="fas fa-trash-alt"></i></button></div></div>`).join('');
            }
            let incDiv=document.getElementById('incomeListContainer');
            if(incDiv){
                if(acc.incomeEntries.length===0) incDiv.innerHTML='<div class="empty-tip">暂无收入记录</div>';
                else incDiv.innerHTML=acc.incomeEntries.map(i=>`<div class="entry-row"><div class="entry-left"><div class="entry-desc">${escapeHtml(i.description||'无备注')}</div><div class="entry-type-badge">${escapeHtml(i.type)}</div></div><div class="entry-right"><div class="entry-amount income-amount">+${(+i.amount).toFixed(2)}</div><button class="delete-icon-btn delete-income" data-id="${i.id}"><i class="fas fa-trash-alt"></i></button></div></div>`).join('');
            }
            // 绑定删除事件
            document.querySelectorAll('.delete-expense').forEach(btn=>{ btn.onclick=()=>{ let id=btn.getAttribute('data-id'); if(confirm('删除支出？')){ acc.expenseEntries=acc.expenseEntries.filter(e=>e.id!==id); refreshUI(); openDetailModal(acc.id); } }; });
            document.querySelectorAll('.delete-income').forEach(btn=>{ btn.onclick=()=>{ let id=btn.getAttribute('data-id'); if(confirm('删除收入？')){ acc.incomeEntries=acc.incomeEntries.filter(i=>i.id!==id); refreshUI(); openDetailModal(acc.id); } }; });
            let exSel=document.getElementById('newExpenseType'); if(exSel) exSel.innerHTML=EXPENSE_TYPES.map(t=>`<option>${escapeHtml(t)}</option>`).join('');
            let inSel=document.getElementById('newIncomeType'); if(inSel) inSel.innerHTML=INCOME_TYPES.map(t=>`<option>${escapeHtml(t)}</option>`).join('');
        };
        renderLists();

        // 添加支出 - 去掉备注弹窗，直接使用默认描述“支出”
        document.getElementById('addExpenseBtn')?.addEventListener('click',()=>{
            let amt=parseFloat(document.getElementById('newExpenseAmount').value);
            if(isNaN(amt)||amt<=0){ alert('金额需大于0'); return; }
            let type=document.getElementById('newExpenseType').value;
            acc.expenseEntries.push({ id:uuid(), amount:Math.round(amt*100)/100, description:'支出', type });
            refreshUI(); openDetailModal(acc.id);
        });
        // 添加收入 - 去掉备注弹窗，直接使用默认描述“收入”
        document.getElementById('addIncomeBtn')?.addEventListener('click',()=>{
            let amt=parseFloat(document.getElementById('newIncomeAmount').value);
            if(isNaN(amt)||amt<=0){ alert('金额需大于0'); return; }
            let type=document.getElementById('newIncomeType').value;
            acc.incomeEntries.push({ id:uuid(), amount:Math.round(amt*100)/100, description:'收入', type });
            refreshUI(); openDetailModal(acc.id);
        });

        let tabs=modalRoot.querySelectorAll('.el-tabs__item');
        let expensePane=document.getElementById('tab-expense'), incomePane=document.getElementById('tab-income');
        let setActive=(id)=>{ tabs.forEach(t=>t.classList.remove('active')); if(id==='expense'){ expensePane.classList.add('active'); incomePane.classList.remove('active'); document.querySelector('.el-tabs__item[data-tab="expense"]').classList.add('active'); }else{ incomePane.classList.add('active'); expensePane.classList.remove('active'); document.querySelector('.el-tabs__item[data-tab="income"]').classList.add('active'); } updateMgr(); };
        tabs.forEach(btn=>btn.addEventListener('click',()=>setActive(btn.getAttribute('data-tab'))));
        setActive('expense');
    }

    // 类型管理（简化版，保留核心功能）
    function openTypeManager(kind,accId){
        const isExpense = kind === 'expense';
        let currentList = isExpense ? [...EXPENSE_TYPES] : [...INCOME_TYPES];
        const title = isExpense ? '管理支出类型' : '管理收入类型';
        const modalHtml = `
            <div class="modal-mask" id="typeManagerModal">
                <div class="modal-container" style="max-width: 400px;">
                    <div class="modal-header"><h3>${title}</h3><button class="close-icon" id="closeTypeModal">×</button></div>
                    <div class="modal-body">
                        <ul class="type-list" id="typeList"></ul>
                        <div style="display:flex; gap:8px;"><input class="el-input" id="newTypeName" placeholder="新类型"><button class="el-button el-button--primary el-button--small" id="addTypeBtn"><i class="fas fa-plus"></i> 添加</button></div>
                    </div>
                    <div class="modal-footer"><button class="el-button" id="closeTypeFooter">关闭</button></div>
                </div>
            </div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        const modal = document.getElementById('typeManagerModal');
        const close = () => modal.remove();
        const renderTypeList = () => {
            const ul = document.getElementById('typeList');
            if (!ul) return;
            ul.innerHTML = currentList.map((t, idx) => `<li><span>${escapeHtml(t)}</span><div><button class="icon-btn edit-type" data-index="${idx}"><i class="fas fa-edit"></i></button><button class="icon-btn del-type" data-index="${idx}"><i class="fas fa-trash-alt"></i></button></div></li>`).join('');
        };
        renderTypeList();
        document.getElementById('addTypeBtn')?.addEventListener('click', () => {
            const newVal = document.getElementById('newTypeName').value.trim();
            if (newVal && !currentList.includes(newVal)) { currentList.push(newVal); renderTypeList(); document.getElementById('newTypeName').value = ''; }
            else alert('类型重复或无效');
        });
        modal.querySelectorAll('.edit-type').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = btn.getAttribute('data-index');
                const old = currentList[idx];
                const newVal = prompt('修改类型名称', old);
                if (newVal && newVal.trim() && !currentList.includes(newVal.trim())) currentList[idx] = newVal.trim();
                else if (newVal) alert('类型已存在');
                renderTypeList();
            });
        });
        modal.querySelectorAll('.del-type').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (currentList.length <= 1) { alert('至少保留一个类型'); return; }
                const idx = btn.getAttribute('data-index');
                currentList.splice(idx, 1);
                renderTypeList();
            });
        });
        const saveAndClose = () => {
            if (isExpense) EXPENSE_TYPES = [...currentList];
            else INCOME_TYPES = [...currentList];
            saveToLocal();
            close();
            if (currentDetailAccountId) openDetailModal(currentDetailAccountId);
            else refreshUI();
        };
        document.getElementById('closeTypeModal')?.addEventListener('click', saveAndClose);
        document.getElementById('closeTypeFooter')?.addEventListener('click', saveAndClose);
    }

    function exportData(){ let data={accounts,incomeTypes:INCOME_TYPES,expenseTypes:EXPENSE_TYPES}; let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})); a.download=`dream_bill_${new Date().toISOString().slice(0,19)}.json`; a.click(); URL.revokeObjectURL(a.href); }
    function importData(file){ let r=new FileReader(); r.onload=e=>{ try{ let d=JSON.parse(e.target.result); if(d.accounts!==undefined) accounts=d.accounts; if(d.incomeTypes) INCOME_TYPES=d.incomeTypes; if(d.expenseTypes) EXPENSE_TYPES=d.expenseTypes; refreshUI(); alert('导入成功'); }catch(err){ alert('文件格式错误'); } }; r.readAsText(file); }

    function bindEvents(){
        document.getElementById('addAccountBtn')?.addEventListener('click',()=>openAccountModal());
        document.getElementById('exportDataBtn')?.addEventListener('click',exportData);
        document.getElementById('importDataBtn')?.addEventListener('click',()=>document.getElementById('importFileInput')?.click());
        document.getElementById('importFileInput')?.addEventListener('change',e=>{ if(e.target.files.length) importData(e.target.files[0]); e.target.value=''; });
        document.body.addEventListener('click',e=>{
            let card=e.target.closest('.account-card');
            if(card && !e.target.closest('.edit-account') && !e.target.closest('.delete-account')){ let id=card.getAttribute('data-id'); if(id) openDetailModal(id); }
            if(e.target.closest('.edit-account')){ e.stopPropagation(); let id=e.target.closest('.edit-account').getAttribute('data-id'); if(id) openAccountModal(id); }
            if(e.target.closest('.delete-account')){ e.stopPropagation(); let id=e.target.closest('.delete-account').getAttribute('data-id'); if(id) deleteAccountById(id,e); }
        });
    }

    function init(){ loadData(); refreshUI(); bindEvents(); }
    init();
</script>
</body>
</html>
